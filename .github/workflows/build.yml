name: Build Flutter APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show environment
        run: flutter --version

      # 仓库只提交了 lib/ 和 pubspec.yaml，没有 android 工程，
      # 这里按需生成（不带 --overwrite，不会覆盖已有业务代码）
      - name: Generate Android platform project
        run: |
          flutter create . --project-name proxy_app --org com.eri --platforms android
          # 双保险：若模板改动了业务代码，恢复为仓库版本
          git checkout -- lib pubspec.yaml 2>/dev/null || true
          test -d android && echo "android 工程已生成"

      - name: Add permissions and app label
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="proxy_app"|android:label="Proxy App"|' android/app/src/main/AndroidManifest.xml
          grep -n 'INTERNET\|ACCESS_NETWORK_STATE\|android:label' android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols

      - name: List artifacts
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: proxy-app-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Proxy App 自动构建

            ### APK 变体
            - `app-arm64-v8a-release.apk` — 64 位 ARM 设备（多数现代手机）
            - `app-armeabi-v7a-release.apk` — 32 位 ARM 设备（老机型）
            - `app-x86_64-release.apk` — x86_64 设备（模拟器/部分平板）

            已启用 `--obfuscate` 代码混淆。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
